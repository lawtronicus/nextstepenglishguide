<!DOCTYPE html>

<html lang="en">
  <head>
    <!-- base head -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Next Step English — Break Your Plateau</title>
    <meta
      name="description"
      content="Break your English plateau with real-world input: podcast, videos, and weekly lessons via email."
    />
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="canonical" href="https://nextstepenglishguide.com/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Next Step English — Break Your Plateau"
    />
    <meta
      property="og:description"
      content="Authentic input and simple routines to help you finally move forward."
    />
    <meta
      property="og:image"
      content="https://nextstepenglishguide.com/assets/img/og-cover.jpg"
    />
    <meta property="og:url" content="https://nextstepenglishguide.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body id="weekly-lessons-body">
    <nav class="header-nav" role="navigation">
      <a id="nav-logo-link" href="/index.html">
        <img
          src="/assets/images/full logo white.png"
          alt="Next Step English Logo"
          id="nav-logo"
        />
      </a>
      <div id="menuToggle">
        <!--
    A fake / hidden checkbox is used as click reciever,
    so you can use the :checked selector on it.
    -->
        <input type="checkbox" id="menuCheckbox" />

        <!--
    Some spans to act as a hamburger.
    
    They are acting like a real hamburger,
    not that McDonalds stuff.
    -->
        <span></span>
        <span></span>
        <span></span>

        <!--
    Too bad the menu has to be inside of the button
    but hey, it's pure CSS magic.
    -->
        <ul id="menu">
          <!-- 
      We can use a label here to close upon click (when doing same page navigation), this
      does require a slight bit of JS.
      -->
          <li>
            <a href="/index.html">
              <label for="menuCheckbox" onclick="this.parentNode.click();"
                >Home</label
              >
            </a>
          </li>
          <li>
            <a href="/podcasts.html">
              <label for="menuCheckbox" onclick="this.parentNode.click();"
                >Podcasts</label
              >
            </a>
          </li>
          <li>
            <a href="/videos.html">
              <label for="menuCheckbox" onclick="this.parentNode.click();"
                >Videos</label
              >
            </a>
          </li>
          <li>
            <a href="/weekly-lessons.html">
              <label for="menuCheckbox" onclick="this.parentNode.click();"
                >Weekly Lessons</label
              >
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <main id="signup-main-content">
      <!-- Hero / Signup section -->
      <section class="signup-hero hero" aria-labelledby="signup-heading">
        <div class="container signup-hero__inner">
          <header class="signup-hero__header">
            <h1 id="signup-heading">
              Learn Real English, One Lesson at a Time
            </h1>
            <p class="signup-hero__subtitle">
              Get one short, useful English lesson in your inbox every week to
              help you reach the next level!
            </p>
          </header>
          <section
            class="signup-form-section"
            aria-label="Sign up for weekly English lessons"
          >
            <!-- This is where you’ll later plug in MailerLite’s embed or your own POST -->
            <form
              class="signup_form"
              method="post"
              action="https://assets.mailerlite.com/jsonp/1983037/forms/173831068682552596/subscribe"
              data-code=""
              target="_blank"
            >
              <p id="sales-text">One FREE email lesson per week!</p>
              <div class="signup-form__field">
                <label for="email">Your email</label>
                <input
                  id="email"
                  aria-label="email"
                  aria-required="true"
                  type="email"
                  class="form-control"
                  data-inputmask=""
                  name="fields[email]"
                  placeholder="Your Email"
                  autocomplete="email"
                />
              </div>

              <button
                type="submit"
                class="btn btn--primary"
                id="signup-form__button"
              >
                Sign me up!
              </button>
            </form>
          </section>
        </div>
        <img
          id="weekly-lesson-background-image"
          src="/assets/images/IMG_7662.png"
          alt="Picture of Lawton Hogan"
        />
      </section>
    </main>

    <!-- Site Footer (duplicated for now) -->
    <footer role="contentinfo">
      <nav class="footer-nav" aria-label="Footer">
        <img src="/assets/images/full logo white.png" alt="" />
        <ul>
          <li><a href="mailto:englishwithlawton@gmail.com">Contact</a></li>
          <li>
            <a
              href="https://www.youtube.com/@Next_Step_English"
              target="_self"
              rel="noopener"
              >YouTube</a
            >
          </li>
          <!-- Add socials as needed -->
        </ul>
      </nav>
      <p class="site-footer__copy">
        &copy; <span id="footer-year"></span> Next Step English. All rights
        reserved.
      </p>
      <script>
        // Tiny helper for the footer year
        document.getElementById("footer-year").textContent =
          new Date().getFullYear();
      </script>
    </footer>
  </body>
</html>
